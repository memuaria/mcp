name: Предложить улучшение
description: Идея, пожелание или отзыв о Memuaria MCP
title: "[Предложение]: "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за идею. Пожалуйста, не добавляйте в публичное сообщение личные воспоминания, контактные данные или учётные сведения.

  - type: textarea
    id: scenario
    attributes:
      label: Какую задачу вы хотите решить
      description: Опишите пользовательский сценарий и желаемый результат.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Предлагаемое улучшение
      description: Расскажите, как Memuaria MCP мог бы помочь в этом сценарии.
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP-клиент
      description: Необязательно. Укажите Claude, Codex, ChatGPT, VS Code, Cursor или другой клиент.

  - type: checkboxes
    id: safety
    attributes:
      label: Проверка безопасности
      options:
        - label: В сообщении нет личных воспоминаний, секретов и персональных данных.
          required: true
